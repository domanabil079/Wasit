<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wasit | وسيط</title>
<style>
:root{--bg:#f5f7fb;--ink:#0b1b3a;--mut:#66738f;--line:#e1e7f0;--green:#12b76a;--red:#e5484d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 Tahoma,Arial,sans-serif;padding:18px}
.wrap{max-width:560px;margin:0 auto}h1{margin:10px 0 4px;font-size:28px}h1 span{color:var(--green)}.mut{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1;padding:11px;border:1px solid var(--line);background:#fff;border-radius:12px;font:inherit;font-weight:bold;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 40px #0b1b3a10}
label{display:block;font-size:13px;font-weight:bold;margin-top:6px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#fff;margin:5px 0 12px}
.btn{width:100%;border:0;border-radius:12px;padding:12px;background:var(--green);color:#04210f;font:inherit;font-weight:bold;cursor:pointer}
.btn.sec{background:#eef2f8;color:var(--ink);margin-top:8px}.btn:disabled{opacity:.6}
.hidden{display:none!important}.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px}.err{background:#fdecec;color:#b3262d}
.ok{background:#e9f8f1;color:#087d49}.code{font:bold 22px monospace;letter-spacing:1px;direction:ltr;text-align:center;background:#f0f3f9;border-radius:12px;padding:12px;margin:10px 0;word-break:break-all}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.steps{list-style:none;padding:0;margin:14px 0 0}.steps li{padding:8px 34px 8px 0;position:relative;color:var(--mut)}
.steps li:before{content:"";position:absolute;right:8px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.steps li.done{color:var(--ink)}.steps li.done:before{background:var(--green)}.steps li.now{font-weight:bold}
.status{font-size:20px;font-weight:bold;margin:6px 0}.foot{text-align:center;margin-top:18px}.foot a{color:var(--mut);font-size:12px}
</style>
</head>
<body><div class="wrap">
<h1>Wasit<span>.</span></h1>
<p class="mut">قدّم طلب وساطة جديد أو تابع حالة عمليتك بالكود.</p>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">طلب جديد</button><button id="t2" onclick="tab(2)">متابعة عملية</button></div>

<div id="p1" class="card">
 <div id="m1"></div>
 <div id="form">
